# =============================================================================
# SETTINGS  --  edit this to tune what counts as an event and where news may
# come from. You will edit companies.yaml far more often than this file.
# =============================================================================

run:
  # Keep every event from this date onward.
  #
  # How far back you actually get depends on the source, not just this setting:
  #   sec_edgar  reaches back years — the workhorse for backfilling history,
  #              and auto-resolves its own CIK from a US ticker (see below)
  #   rss        only what the feed currently carries, typically 20-50 items
  #   ir_page    only what's on the page you pointed it at
  #   news       last 30 days only (it's corroboration, not an archive)
  # So for real history back to 2020, give US-listed companies a `sec_edgar`
  # source. Companies that don't file with the SEC (most HK, JP, TW, KR and
  # CN names) will only fill in from the day you start running this daily,
  # unless you add a company_ir source with real history of its own.
  history_from: "2020-01-01"
  lookahead_days: 730         # keep scheduled events this far into the future
  # (connect, read) seconds. A slow or silently-dropping host fails fast on
  # the connect leg rather than eating its full timeout twice.
  request_timeout: [6, 15]
  # Ceiling on how long a single response is allowed to take to fully
  # download, wall-clock. This is NOT the same guarantee as request_timeout
  # above: that tuple only bounds the *gap* between successive socket reads,
  # not the total transfer — a server that trickles bytes down just fast
  # enough to keep resetting that per-chunk clock can hold a connection open
  # indefinitely without ever tripping it. _get() streams the body itself and
  # checks this deadline against real elapsed time as chunks arrive, so no
  # single fetch (the SEC ticker-list download in particular, which every
  # US company's CIK auto-resolve funnels through behind one shared lock) can
  # hang past this no matter how it trickles. Matters even with max_run_seconds
  # and max_polite_wait_seconds both in place: ThreadPoolExecutor's worker
  # threads aren't daemon threads, so one thread stuck inside a single
  # response read — not waiting in the politeness queue, already past that
  # and mid-download — still blocks the whole process from exiting.
  max_response_seconds: 60
  polite_delay_seconds: 1.0   # pause between requests to the same host
  # A handful of large public endpoints (SEC EDGAR, Google News) are shared
  # by every company using them, so the plain per-host delay above would
  # serialise thousands of companies behind one clock. Both publish (or
  # tolerate) faster access than a small company IR site would want — SEC's
  # published fair-access guideline is up to 10 requests/second — so they
  # get their own, still-polite, delay instead of the default.
  host_delay_overrides:
    data.sec.gov: 0.12
    # Same operator, same published 10-requests-per-second guideline as
    # data.sec.gov above, but a different hostname — so without its own entry
    # it fell back to polite_delay_seconds (1.0s) and every request
    # serialised a full second behind the last. This is the host the filing
    # text scan reads from (cover page, filing index, press-release exhibit)
    # and where the ticker->CIK map lives, so that default silently made the
    # scan the slowest thing in the run: one refresh skipped 885 of 1247
    # sec_edgar sources for lack of time, having spent it waiting here.
    www.sec.gov: 0.12
    news.google.com: 0.4
  # How many (company, source) fetches run at once. Different hosts run
  # concurrently; requests to the *same* host still queue behind that host's
  # delay above, so this mainly helps when tracking many companies spread
  # across many different IR domains.
  max_workers: 12
  # A ceiling on how long any single fetch will wait in a shared host's
  # politeness queue before giving up on that one source for this run
  # (it'll get another chance next run — see the shuffled fetch order
  # note on max_run_seconds below). Exists because a wait *inside* that
  # queue can't be interrupted by max_run_seconds the way waiting for a
  # result can: once a worker thread has picked up a task and started
  # sleeping here, it's committed until its reserved slot arrives. With
  # thousands of companies sharing one host (news.google.com, say) and
  # request submission being near-instant, that queue can silently grow
  # to hours deep — and because those worker threads aren't daemon
  # threads, the whole process wouldn't exit until every one of them
  # finished, no matter what max_run_seconds said. This is what actually
  # bounds that: 45s deep and a fetch just fails fast instead of queuing
  # further back. (Confirmed on real infrastructure, not just estimated:
  # this is why a run tuned for ~25 minutes took a real 5 hours on GitHub
  # Actions before this ceiling existed.)
  max_polite_wait_seconds: 45
  # Raised so a full year of SEC filings can come back in one pull. RSS feeds
  # cap themselves (most carry 20-50 recent items) so this mainly affects
  # EDGAR, which is the one source that genuinely reaches back years.
  max_items_per_source: 250
  # Ceiling on the *fetching* phase, wall-clock — not the whole run.
  # Classifying, grouping, link-checking and storing whatever was actually
  # fetched always runs to completion regardless of this number; only
  # fetching stops once it's hit, and whichever companies didn't get
  # fetched this cycle are named in the run's notes and get first priority
  # next time (fetch order is shuffled every run specifically so a
  # time-limited cycle doesn't stall on the same prefix of companies.yaml
  # forever — coverage of the whole roster converges over many cycles even
  # when no single cycle finishes everything). (An earlier version gated
  # the *whole run* behind this number, so a fetch phase that ran long on
  # real-world network latency could silently discard everything it had
  # already gathered — fixed; see pipeline.py's module docstring.)
  #
  # Kept well under 15 minutes on purpose: Render's free tier (the
  # zero-cost hosting option this project's README recommends first) sleeps
  # the whole process after ~15 minutes with no incoming requests, which
  # kills an in-progress cycle and — because that tier's disk is also
  # ephemeral — throws away everything gathered since the last successful
  # write. 600s leaves headroom for the (usually much faster, but
  # unbounded) link-check-and-store phase to also finish inside that
  # window, as long as something (a visitor's browser polling
  # /api/status, or you keeping a tab open) keeps the service registering
  # as active the whole time. Self-hosting locally, or on a host with a
  # persistent disk and no auto-sleep, has none of these constraints —
  # raise this freely (a full pass over ~2,900 companies takes roughly 20
  # minutes end-to-end at 1800s, mostly rate-limited behind
  # news.google.com — see host_delay_overrides above).
  max_run_seconds: 600
  # Wall-clock ceiling on the link-check-and-store phase that follows
  # fetching — deliberately a separate, generous budget rather than sharing
  # max_run_seconds above (see pipeline.py's module docstring for why that
  # phase runs unconditionally at all). This exists because that phase used
  # to have no bound whatsoever: a bare `with ThreadPoolExecutor(...) as
  # pool:` block whose implicit exit calls shutdown(wait=True)
  # unconditionally, so even wrapping its as_completed() in a timeout
  # wouldn't have helped once one bad link-check wedged a worker thread —
  # and since this phase logs nothing per item, that kind of stall is
  # silent. This is what turned a job budgeted for well under an hour into
  # one GitHub Actions had to kill at its own 6-hour hard limit, with no
  # error and no clue in the logs about which phase was even stuck.
  # Sized against the hourly schedule: fetch (max_run_seconds) plus this
  # must leave room to publish inside the hour. The cache below is what
  # makes a bound this tight workable — most URLs cost nothing to "check".
  max_link_check_seconds: 600
  # How long a link-check result stays good before that URL is re-checked.
  # An hourly run asking every host about every URL 24 times a day is both
  # wasteful and rude; a link that answered this morning is not meaningfully
  # more likely to be dead this afternoon.
  link_check_ttl_hours: 24
  user_agent: "CorporateEventTracker/1.0 (research use; contact: you@example.com)"
  # ^ SEC EDGAR requires a real contact address in the User-Agent. Put yours in.

output:
  html_path: "out/dashboard.html"
  db_path: "data/events.db"
  # An event counts as "recently changed" if it moved within this many days.
  change_window_days: 14

# -----------------------------------------------------------------------------
# REFRESH
# `python -m tracker serve` runs a local server that rebuilds the page from the
# database on every visit, instantly — visiting or refreshing the page never
# itself starts a scrape. Instead the tracker refreshes itself continuously in
# the background, on background_interval_minutes below, for as long as `serve`
# keeps running — the first cycle starts the moment the process launches, not
# at a fixed clock time. So: start the tracker before you plan to check it
# (leave the launcher window open, or host `serve` somewhere always-on) and
# the page is already current by the time you open it, no waiting involved.
# "Refresh now" still forces an extra cycle on demand, it just isn't the
# only thing keeping the data fresh any more.
# -----------------------------------------------------------------------------
refresh:
  port: 8765
  # Time between the START of one background cycle and the start of the
  # next. With the default run.max_run_seconds (600s) a large roster's
  # fetch phase is capped at 10 minutes, plus however long link-checking
  # takes on top (usually a few more, see run.max_run_seconds) — comfortably
  # inside the default 60-minute interval, leaving idle time between
  # cycles. A smaller roster finishes in seconds and effectively refreshes
  # every 60 minutes on the dot. Lower this if you want fresher data and
  # don't mind the extra load on the sources; there's a 60-second floor
  # regardless, so this can't be set to spin continuously.
  background_interval_minutes: 60

# -----------------------------------------------------------------------------
# NEWS WHITELIST
# Nothing outside this list is ever written to the dashboard. Add or remove
# domains freely. Company-owned domains are added automatically from
# companies.yaml, so you don't need to list them here.
# -----------------------------------------------------------------------------
news:
  enabled: true
  allowed_domains:
    # wire services and primary financial press
    - reuters.com
    - bloomberg.com
    - ft.com
    - wsj.com
    - nikkei.com
    - asia.nikkei.com
    - businesstimes.com.sg
    - straitstimes.com
    - scmp.com
    - cnbc.com
    - barrons.com
    # official press-release distributors (company copy, verbatim)
    - businesswire.com
    - globenewswire.com
    - prnewswire.com
    - newsroom.accenture.com
    # exchange and regulator sites
    - sec.gov
    - hkexnews.hk
    - www1.hkexnews.hk
    - sgx.com
    - release.tdnet.info
    - mops.twse.com.tw

# -----------------------------------------------------------------------------
# EVENT TAXONOMY
# Each category has weighted patterns (case-insensitive regex). An item is
# scored against every category; the highest score wins. `min_score` is the
# floor below which an item is discarded as not-an-event.
#
# To add a category: copy a block. To stop tracking one: set enabled: false.
# -----------------------------------------------------------------------------
classifier:
  min_score: 2.0
  categories:

    earnings_call:
      label: "Earnings Call"
      enabled: true
      patterns:
        - ['\bearnings\s+(call|conference\s+call|webcast)\b', 4.0]
        - ['\b(q[1-4]|first|second|third|fourth)[\s-]*quarter.*\bcall\b', 3.5]
        - ['\bconference\s+call\b', 2.0]
        - ['\bwebcast\b', 2.0]
        - ['\bdial[- ]?in\b', 1.5]

    earnings_release:
      label: "Earnings Release"
      enabled: true
      patterns:
        - ['\b(reports?|announces?|posts?)\b.{0,40}\b(q[1-4]|quarter|half[- ]year|full[- ]year|annual|interim)\b.{0,30}\b(results?|earnings)\b', 4.5]
        - ['\b(q[1-4]|first|second|third|fourth)[\s-]*quarter\s+(20\d\d\s+)?(financial\s+)?results?\b', 4.0]
        - ['\b(interim|annual|full[- ]year|half[- ]year)\s+(financial\s+)?(results?|report)\b', 3.5]
        - ['\bfinancial\s+results?\b', 2.5]
        - ['\b(interim|annual|quarterly)\s+(profit|earnings|revenue|loss)\b', 3.0]
        - ['\b(beats?|misses?|tops?|falls?\s+short\s+of)\s+(estimates?|expectations?|consensus|forecasts?)\b', 3.0]
        - ['\bprofit\s+(warning|alert)\b', 3.0]
        # A full P&L write-up mentions margin/profit alongside revenue; a
        # routine sales update almost never does. This disambiguates a
        # quarterly earnings headline ("record quarterly revenue") from a
        # monthly/quarterly top-line-only sales note, which otherwise score
        # the same on the word "revenue" alone.
        - ['\b(revenue|sales)\b.{0,120}\b(gross\s+margin|operating\s+(income|profit|margin)|net\s+income|diluted\s+(earnings|EPS))\b', 4.0]
        - ['\b(gross\s+margin|operating\s+(income|profit)|net\s+income|diluted\s+(earnings|EPS))\b.{0,120}\b(revenue|sales)\b', 4.0]
        - ['\b8-K\s+item\s+2\.02\b', 5.0]

    guidance:
      label: "Guidance"
      enabled: true
      patterns:
        - ['\b(raises?|lowers?|cuts?|lifts?|updates?|reaffirms?|withdraws?)\b.{0,25}\b(guidance|outlook|forecast)\b', 4.5]
        - ['\b(guidance|outlook)\s+(for|update|revision)\b', 3.0]
        - ['\bfull[- ]year\s+(guidance|outlook)\b', 3.0]
        - ['\brevised?\s+(forecast|outlook|guidance)\b', 3.5]
        - ['\bguidance\b', 2.0]

    investor_day:
      label: "Investor Day"
      enabled: true
      patterns:
        - ['\binvestor\s+(day|meeting)\b', 4.5]
        - ['\bcapital\s+markets?\s+day\b', 5.0]
        - ['\banalyst\s+(day|meeting|briefing)\b', 4.0]
        - ['\bstrategy\s+(day|update|briefing)\b', 3.0]

    capital_markets_day:
      label: "Capital Markets Day"
      enabled: true
      patterns:
        - ['\bcapital\s+markets?\s+day\b', 6.0]
        - ['\bCMD\s+20\d\d\b', 3.0]

    analyst_marketing:
      label: "Analyst Marketing"
      enabled: true
      patterns:
        - ['\bnon[- ]deal\s+roadshow\b', 4.5]
        - ['\broadshow\b', 3.0]
        - ['\banalyst\s+(marketing|outreach)\b', 4.0]
        - ['\bmanagement\s+(meetings?|roadshow)\b', 2.5]

    conference:
      label: "Conference"
      enabled: true
      patterns:
        - ['\b(to\s+)?(present|participate|speak)\b.{0,60}\bconference\b', 4.0]
        - ['\b(global|annual|technology|investor|industry)\s+conference\b', 3.5]
        - ['\b(summit|symposium|expo|trade\s+show|forum)\b', 2.5]
        - ['\bconference\b', 1.5]
        - ['\bkeynote\b', 2.0]

    corporate_access:
      label: "Corporate Access"
      enabled: true
      patterns:
        - ['\bfireside\s+chat\b', 4.5]
        - ['\bsite\s+(visit|tour)\b', 3.5]
        - ['\b(plant|fab|factory)\s+(tour|visit|opening)\b', 3.5]
        - ['\bcorporate\s+access\b', 4.0]
        - ['\bone[- ]on[- ]one\s+meetings?\b', 3.0]

    mergers_acquisitions:
      label: "M&A"
      enabled: true
      patterns:
        - ['\b(to\s+)?acquires?\b', 4.0]
        - ['\bacquisition\s+of\b', 4.5]
        - ['\b(merger|merges?\s+with)\b', 4.5]
        - ['\b(definitive|share\s+purchase|business\s+combination)\s+agreement\b', 4.0]
        - ['\b(divest|divestiture|disposal|carve[- ]out|spin[- ]off|sells?\s+stake)\b', 3.5]
        - ['\b(tender|takeover)\s+offer\b', 4.0]
        - ['\bjoint\s+venture\b', 3.0]
        - ['\bcompletes?\s+(the\s+)?(acquisition|merger|sale)\b', 4.0]

    shareholder_meeting:
      label: "Shareholder Meeting"
      enabled: true
      patterns:
        - ['\b(annual|extraordinary|special)\s+general\s+meeting\b', 5.0]
        - ['\b(AGM|EGM|SGM)\b', 4.5]
        - ['\bshareholders?\s+meeting\b', 4.5]
        # US proxy statements phrase it this way rather than "general
        # meeting" — without these, a DEF 14A's "Annual Meeting of
        # Stockholders" scored 0 and the event was dropped outright.
        - ['\b(annual|special)\s+meeting\s+of\s+(share|stock)holders\b', 5.0]
        - ['\bannual\s+meeting\b', 2.5]
        - ['\bproxy\s+statement\b', 3.5]
        - ['\bnotice\s+of\s+meeting\b', 3.5]
        - ['\bvoting\s+results?\b', 3.0]
        - ['\b8-K\s+item\s+5\.07\b', 5.0]

    sales_results:
      label: "Sales Results"
      enabled: true
      patterns:
        # "Monthly" is the distinctive signal for a routine top-line-only
        # note. A bare "quarterly revenue" is deliberately weighted low here
        # because it also appears in full earnings releases (see the
        # disambiguating patterns added to earnings_release above) — without
        # that gap, "record quarterly revenue" in an earnings headline
        # outscores the earnings-release category on this word alone.
        - ['\bmonthly\s+(revenue|sales)\b', 4.5]
        - ['\bquarterly\s+(revenue|sales)\b', 1.5]
        - ['\b(revenue|sales)\s+(for|report|update)\b.{0,25}\b(month|monthly)\b', 4.0]
        - ['\b(shipment|delivery|unit)\s+(volumes?|numbers?|data)\b', 3.0]
        - ['\b(booking|order\s+intake|backlog)\s+(update|report)\b', 3.0]
        - ['\bsales\s+figures?\b', 3.0]

    other_material:
      label: "Other Material"
      enabled: true
      patterns:
        - ['\b(dividend|buyback|share\s+repurchase|bond\s+issue|rights\s+issue)\b', 3.0]
        - ['\b(CEO|CFO|chairman|board)\b.{0,30}\b(appoint|resign|steps?\s+down|succeed)\b', 3.5]
        - ['\bcredit\s+rating\b', 2.5]
        - ['\bcapacity\s+expansion\b', 2.5]

# -----------------------------------------------------------------------------
# SEC 8-K item codes -> category. These are exact, so they override keywords.
# -----------------------------------------------------------------------------
sec_item_map:
  "1.01": mergers_acquisitions
  "2.01": mergers_acquisitions
  "2.02": earnings_release
  "5.02": other_material
  "5.07": shareholder_meeting
  "7.01": investor_day
  "8.01": other_material
