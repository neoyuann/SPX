name: Refresh and publish to GitHub Pages

# Runs the tracker on GitHub's own servers on a schedule and publishes a
# static snapshot to GitHub Pages — a genuinely free, always-available
# alternative to hosting `tracker serve` somewhere, with none of a paid-
# tier-required host's sleep-on-idle or ephemeral-disk problems (see
# render.yaml if you're weighing that against this). There's no server
# behind the published page, only a page rebuilt on this schedule, so it
# carries no "Refresh now" button — this job is the refresh. Roster changes
# still work from the page: its company panel opens an issue form, which
# roster-request.yml applies to companies.yaml (or edit that file directly,
# or run import_excel_companies.py locally, same as any other change).
#
# Unlike a naive "fetch and publish" job, this one also commits data/events.db
# back to the repo after every run (the "Persist accumulated data" step
# below) — without that, every run would start over from whatever's already
# committed and never accumulate history, which defeats the whole point.
# Combined with pipeline.py's shuffled fetch order, coverage of a large
# roster grows across scheduled runs even though any single run is time-
# boxed (TRACKER_MAX_RUN_SECONDS below) well under this job's own limits.

on:
  schedule:
    # Every hour, on the hour. Cron here is UTC, but an hourly schedule is
    # the same wall-clock set of moments in every zone, so this is "every
    # hour of every day" in Singapore time too — the page's own timestamps
    # are rendered in SGT (see render.py).
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    # Whichever branch is actually this repo's default — Settings → General
    # → "Default branch" shows/changes it. schedule and workflow_dispatch
    # below don't depend on this list at all; they always run against
    # whatever the default branch is, named "main" or not.
    branches: [main, claude/company-events-scraper-hkxds4]

permissions:
  contents: write   # needed to commit data/events.db back to the repo
  pages: write
  id-token: write

concurrency:
  # Hourly runs must not pile up behind each other: if one overruns, the
  # next queues, and a backlog would keep the page stale for hours. Each
  # run is a full refresh rather than an increment (nothing stored is ever
  # lost by skipping one), so superseding an in-flight run is safe and
  # keeps the published page tracking the latest data.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: TRACKER_MAX_RUN_SECONDS (20 min) plus
    # max_link_check_seconds (10 min, config.yaml) should bound the run
    # itself well under this, but a runaway job used to sit in "in_progress"
    # for GitHub's own 6-hour default hard limit before anyone noticed.
    # Set under the hourly interval so a stuck run can never still be
    # holding the slot when the next one is due.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch every source and build the static page
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          # Sized to finish comfortably inside the hour between runs, with
          # room for the link-check and publish phases after it. A single
          # run doesn't need to cover the whole roster: fetch order is
          # shuffled (see pipeline.py), nothing already stored is ever
          # dropped, and at 24 runs a day coverage accumulates quickly.
          TRACKER_MAX_RUN_SECONDS: "1200"
        run: python -m tracker run

      - name: Persist accumulated data
        run: |
          if git diff --quiet -- data/events.db; then
            echo "No changes to data/events.db this run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/events.db
            git commit -m "Scheduled refresh: update tracked events [skip ci]"
            # A roster request (roster-request.yml) can land on the same
            # branch while this run was fetching, so don't assume the push
            # is a fast-forward. Rebase onto whatever arrived and retry.
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected (attempt $attempt) — rebasing onto the branch and retrying."
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            done
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp out/dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
