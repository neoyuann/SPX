name: Apply roster requests

# The published dashboard has no server behind it, so its "add / remove
# companies" panel opens one of the issue forms in .github/ISSUE_TEMPLATE
# instead of posting to an API. This applies the request to companies.yaml,
# replies on the issue, and closes it. The next scheduled refresh picks the
# change up — no separate deploy needed.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  # companies.yaml is a single file every request rewrites, so two requests
  # applied at once would race and one would be lost.
  group: roster-request
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'roster')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Apply the request
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          if printf '%s' "$ISSUE_BODY" | python apply_roster_request.py > result.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'result<<RESULT_EOF'
            cat result.txt
            echo 'RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit the roster change
        if: steps.apply.outputs.ok == 'true'
        run: |
          if git diff --quiet -- companies.yaml; then
            echo "Request applied but companies.yaml is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add companies.yaml
            git commit -m "Roster request from #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Reply and close
        uses: actions/github-script@v7
        with:
          script: |
            const ok = ${{ steps.apply.outputs.ok == 'true' }};
            const result = ${{ toJSON(steps.apply.outputs.result) }};
            const body = ok
              ? `${result.trim()}\n\nThe dashboard will show this after its next hourly refresh.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              : `This request couldn't be applied.\n\n\`\`\`\n${result.trim()}\n\`\`\`\n\nEdit the issue and reopen it to try again.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
